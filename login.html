<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinanceFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Redirect if already logged in -->
    <script>
        if (localStorage.getItem("currentUser")) {
            window.location.href = "index.html";
        }
    </script>

    <div class="auth-container">
        <div class="auth-card glass-panel fade-in">
            <h2>Welcome Back</h2>
            
            <div id="loginError" class="form-error">Invalid email or password</div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn primary-btn">Login</button>
            </form>

            <div class="auth-links">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const errorEl = document.getElementById('loginError');
            errorEl.classList.remove('active');

            // 1. Get and trim values, lowercase email
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                errorEl.textContent = "Please fill in all fields.";
                errorEl.classList.add('active');
                return;
            }

            console.log("Attempting login for:", email);

            // 2. Fetch user from localStorage
            let user = null;
            try {
                const userData = localStorage.getItem('user_' + email);
                if (userData) {
                    user = JSON.parse(userData);
                }
            } catch (err) {
                console.error("Error parsing user data:", err);
            }

            // 3. Validate credentials
            if (user && user.password === password) {
                console.log("Login successful!");
                // 4. Set session and redirect
                localStorage.setItem("currentUser", email);
                window.location.href = "index.html";
            } else {
                console.log("Login failed. User found:", !!user);
                errorEl.textContent = "Invalid email or password.";
                errorEl.classList.add('active');
            }
        });
    </script>

</body>
</html>
